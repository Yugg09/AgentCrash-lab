services:
  postgres:
    image: postgres:16-alpine
    container_name: acl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acl
      POSTGRES_PASSWORD: acl
      POSTGRES_DB: agentcrashlab
    ports:
      - "5433:5432"
    volumes:
      - acl_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acl -d agentcrashlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: acl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  acl_pg_data:
